name: Release Beta DMG

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: release-beta-dmg
  cancel-in-progress: true

jobs:
  prepare-beta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
      release_branch: ${{ steps.meta.outputs.release_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve beta release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "beta" ]]; then
            echo "This workflow only supports the beta branch. Current ref: ${GITHUB_REF_TYPE}/${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          echo "tag=beta" >> "$GITHUB_OUTPUT"
          echo "version=beta" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "source_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_branch=beta-release" >> "$GITHUB_OUTPUT"

  build-dmg:
    needs: prepare-beta
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_arch: arm64
            dmg_suffix: apple-silicon
            artifact_name: dmg-arm64
            bundle_mihomo_binary: '1'
          - target_arch: arm64
            dmg_suffix: apple-silicon-no-core
            artifact_name: dmg-arm64-no-core
            bundle_mihomo_binary: '0'
          - target_arch: x86_64
            dmg_suffix: intel
            artifact_name: dmg-x86_64
            bundle_mihomo_binary: '1'
          - target_arch: x86_64
            dmg_suffix: intel-no-core
            artifact_name: dmg-x86_64-no-core
            bundle_mihomo_binary: '0'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-beta.outputs.source_ref }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode -o /tmp/cert.p12
          security create-keychain -p "build_kc" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "build_kc" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "build_kc" build.keychain
          rm /tmp/cert.p12

      - name: Verify Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          if ! swift --version | grep -Eq 'Swift version (6\.[2-9]|[7-9]\.)'; then
            echo "Swift 6.2+ is required by Package.swift (// swift-tools-version: 6.2)." >&2
            exit 1
          fi

      - name: Build app
        shell: bash
        run: |
          APP_VERSION="${{ needs.prepare-beta.outputs.version }}" \
          BUILD_NUMBER="${{ needs.prepare-beta.outputs.build_number }}" \
          PREPARE_MIHOMO_BINARY="${{ matrix.bundle_mihomo_binary }}" \
          BUNDLE_MIHOMO_BINARY="${{ matrix.bundle_mihomo_binary }}" \
          TARGET_ARCH="${{ matrix.target_arch }}" \
          CODESIGN_IDENTITY="Developer ID Application" \
          CODESIGN_KEYCHAIN="build.keychain" \
          ./Scripts/build.sh app

      - name: Notarize app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$ASC_PRIVATE_KEY" > /tmp/asc_key.p8
          cd dist
          ditto -c -k --keepParent ClashBar.app ClashBar.zip
          SUBMIT_OUT=""
          SUBMIT_EXIT=1
          for ATTEMPT in 1 2 3; do
            set +e
            SUBMIT_OUT=$(xcrun notarytool submit ClashBar.zip \
              --key /tmp/asc_key.p8 \
              --key-id "$ASC_KEY_ID" \
              --issuer "$ASC_ISSUER_ID" \
              --wait --output-format json 2>&1)
            SUBMIT_EXIT=$?
            set -e
            echo "$SUBMIT_OUT"
            if [ "$SUBMIT_EXIT" -eq 0 ]; then
              break
            fi
            echo "Notary submission attempt $ATTEMPT failed with exit code $SUBMIT_EXIT"
            if [ "$ATTEMPT" -lt 3 ]; then
              sleep $((ATTEMPT * 15))
            fi
          done
          if [ "$SUBMIT_EXIT" -ne 0 ]; then
            rm -f /tmp/asc_key.p8 ClashBar.zip
            exit "$SUBMIT_EXIT"
          fi
          STATUS=$(echo "$SUBMIT_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || true)
          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization failed with status: $STATUS"
            SUBMISSION_ID=$(echo "$SUBMIT_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])" 2>/dev/null || true)
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key /tmp/asc_key.p8 \
                --key-id "$ASC_KEY_ID" \
                --issuer "$ASC_ISSUER_ID" || true
            fi
            rm -f /tmp/asc_key.p8
            exit 1
          fi
          xcrun stapler staple ClashBar.app
          rm -f /tmp/asc_key.p8 ClashBar.zip

      - name: Build dmg
        shell: bash
        run: |
          APP_VERSION="${{ needs.prepare-beta.outputs.version }}" \
          DMG_SUFFIX="${{ matrix.dmg_suffix }}" \
          ./Scripts/build.sh dmg

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/ClashBar-${{ needs.prepare-beta.outputs.version }}-${{ matrix.dmg_suffix }}.dmg
            dist/ClashBar-${{ needs.prepare-beta.outputs.version }}-${{ matrix.dmg_suffix }}.dmg.sha256
          if-no-files-found: error

  release:
    needs: [prepare-beta, build-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-beta.outputs.source_ref }}

      - name: Download dmg artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
          path: dist

      - name: Generate beta release body
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_BRANCH: ${{ needs.prepare-beta.outputs.release_branch }}
          SOURCE_BRANCH: beta
        run: |
          chmod +x Scripts/generate_beta_release_notes.sh
          Scripts/generate_beta_release_notes.sh \
            "${{ needs.prepare-beta.outputs.tag }}" \
            "${{ needs.prepare-beta.outputs.version }}" \
            release.md

      - name: Publish beta release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-beta.outputs.tag }}
          target_commitish: ${{ needs.prepare-beta.outputs.source_ref }}
          name: ClashBar ${{ needs.prepare-beta.outputs.version }}
          body_path: release.md
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.dmg.sha256

  sync-beta-channel:
    needs: [prepare-beta, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-beta.outputs.source_ref }}

      - name: Move beta channel refs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -f "${{ needs.prepare-beta.outputs.tag }}" "${{ needs.prepare-beta.outputs.source_ref }}"
          git push origin "refs/tags/${{ needs.prepare-beta.outputs.tag }}" --force
          git push origin "${{ needs.prepare-beta.outputs.source_ref }}:refs/heads/${{ needs.prepare-beta.outputs.release_branch }}" --force
